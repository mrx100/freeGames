<!doctype html>
<html lang="en">
<head>

  <title>Free Games</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08051c; color: #f4f1ff; }
    main { width: min(92%, 680px); padding: 3rem 0; text-align: center; }

    a:hover, a:focus-visible { background: #62f6c3; color: #08051c; }
  </style>
</head>
<body>
  <main>
    <h1>Free Games</h1>
