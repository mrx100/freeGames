<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Space Invaders game preview</title>
  <desc id="desc">A neon green player ship faces colorful alien invaders in deep space.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#070026"/>
      <stop offset="1" stop-color="#02020e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g fill="#fff" opacity=".75">
    <circle cx="90" cy="90" r="2"/><circle cx="180" cy="260" r="3"/><circle cx="330" cy="120" r="2"/><circle cx="500" cy="70" r="2"/><circle cx="730" cy="165" r="3"/><circle cx="930" cy="92" r="2"/><circle cx="1160" cy="210" r="3"/><circle cx="1080" cy="520" r="2"/><circle cx="250" cy="520" r="2"/>
  </g>
  <text x="640" y="90" fill="#00f0ff" font-family="monospace" font-size="54" font-weight="bold" text-anchor="middle" letter-spacing="8" filter="url(#glow)">SPACE INVADERS</text>
  <text x="640" y="130" fill="#ff5a7d" font-family="monospace" font-size="20" text-anchor="middle" letter-spacing="5">ULTIMATE EDITION</text>
  <g filter="url(#glow)" stroke-width="5">
    <g fill="#ff3d81" stroke="#ff9ab8"><path d="M225 235h42v-18h18v18h18v18h-12v30h-18v-12h-42v12h-18v-30h-12v-18h18v-18h6z"/><circle cx="243" cy="246" r="4" fill="#080020"/><circle cx="277" cy="246" r="4" fill="#080020"/></g>
    <g fill="#9bff36" stroke="#d6ff9c"><path d="M450 235h42v-18h18v18h18v18h-12v30h-18v-12h-42v12h-18v-30h-12v-18h18v-18h6z"/><circle cx="468" cy="246" r="4" fill="#080020"/><circle cx="502" cy="246" r="4" fill="#080020"/></g>
    <g fill="#b76cff" stroke="#e3c5ff"><path d="M675 235h42v-18h18v18h18v18h-12v30h-18v-12h-42v12h-18v-30h-12v-18h18v-18h6z"/><circle cx="693" cy="246" r="4" fill="#080020"/><circle cx="727" cy="246" r="4" fill="#080020"/></g>
    <g fill="#ffd43b" stroke="#fff0a0"><path d="M900 235h42v-18h18v18h18v18h-12v30h-18v-12h-42v12h-18v-30h-12v-18h18v-18h6z"/><circle cx="918" cy="246" r="4" fill="#080020"/><circle cx="952" cy="246" r="4" fill="#080020"/></g>
  </g>
  <g fill="#ff4f6d" filter="url(#glow)"><rect x="230" y="350" width="8" height="34"/><rect x="688" y="320" width="8" height="34"/><rect x="950" y="370" width="8" height="34"/></g>
  <g fill="#49ffb0" stroke="#baffdf" stroke-width="5" filter="url(#glow)"><path d="M640 535l-68 70h42l26 42 26-42h42z"/><rect x="630" y="575" width="20" height="55"/></g>
  <text x="640" y="680" fill="#b7bddb" font-family="monospace" font-size="22" text-anchor="middle">ARROWS / A-D TO MOVE  •  SPACE TO FIRE</text>
</svg>
